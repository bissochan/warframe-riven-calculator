<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riven Calculator · Luca Bissoli</title>
    <meta name="description" content="Grade Warframe riven mods, find the best stats per weapon and simulate cycling, trait locking and splicing." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved/system theme before first paint (same key as the personal site). -->
    <script>
      (() => {
        let theme = null;
        try { theme = localStorage.getItem('theme'); } catch {}
        const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
